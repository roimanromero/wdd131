<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Album</title>

    <meta name="description" content="A responsive Temple Album showcasing different temple locations." />
    <meta name="author" content="Roiman Romero" />

    <!-- Google Fonts (1–2 fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile-first CSS -->
    <link rel="stylesheet" href="styles/temples.css" />
    <link rel="stylesheet" href="styles/temples-large.css" />

    <!-- Deferred JS -->
    <script src="scripts/filtered-temples.js" defer></script>

  </head>

  <body>
    <header>
      <span class="site-title">Temple Album</span>

      <button
        class="hamburger"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="primary-nav"
      >
        <span class="hamburger-icon" aria-hidden="true">☰</span>
      </button>

      <nav id="primary-nav">
        <ul>
          <li><a href="#" aria-current="page">Home</a></li>
          <li><a href="#old">Old</a></li>
          <li><a href="#new">New</a></li>
          <li><a href="#large">Large</a></li>
          <li><a href="#small">Small</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Temple Collection</h1>

      <section class="grid" id="templeGrid" aria-label="Temple list"></section>

    </main>

    <footer>
      <p class="footer-main">
        &copy;<span id="currentyear"></span> Roiman Romero · Barranquilla, Colombia
      </p>
      <p class="footer-modified" id="lastModified"></p>
    </footer>
  </body>
</html>
