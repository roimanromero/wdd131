<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Sunny weather">
  <title>Sunny</title>
  <!-- Sun rays -->
  <g stroke="#D4A017" stroke-width="3.5" stroke-linecap="round">
    <line x1="50" y1="8"  x2="50" y2="18"/>
    <line x1="50" y1="82" x2="50" y2="92"/>
    <line x1="8"  y1="50" x2="18" y2="50"/>
    <line x1="82" y1="50" x2="92" y2="50"/>
    <line x1="19.6" y1="19.6" x2="26.7" y2="26.7"/>
    <line x1="73.3" y1="73.3" x2="80.4" y2="80.4"/>
    <line x1="80.4" y1="19.6" x2="73.3" y2="26.7"/>
    <line x1="26.7" y1="73.3" x2="19.6" y2="80.4"/>
  </g>
  <!-- Sun body -->
  <circle cx="50" cy="50" r="20" fill="#F2C94C" stroke="#D4A017" stroke-width="2"/>
  <!-- Inner glow -->
  <circle cx="50" cy="50" r="13" fill="#FFE082" opacity="0.6"/>
</svg>
